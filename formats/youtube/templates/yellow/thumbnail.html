<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Barlow;font-weight:900;src:url(fonts/barlow-latin-900-normal.woff2)}
@font-face{font-family:Barlow;font-weight:800;src:url(fonts/barlow-latin-800-normal.woff2)}
@font-face{font-family:Plex;font-weight:600;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;position:relative;font-family:Barlow}
.tag{position:absolute;left:60px;top:48px;font-family:Plex;font-weight:600;font-size:30px;letter-spacing:.1em}
.row{position:absolute;display:flex;gap:16px}
.c{width:150px;height:170px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:120px}
.ix{position:absolute;display:flex;gap:16px;font-family:Plex;font-weight:600;font-size:30px}
.ix span{width:150px;text-align:center}

body{background:#0d0d0d;color:#fff}
.tag{color:#FFD60A}
.big{position:absolute;left:56px;top:130px;font-weight:900;font-size:150px;line-height:.9;text-transform:uppercase;letter-spacing:-.02em}
.hook{position:absolute;left:60px;top:430px;display:flex;align-items:center;gap:26px;font-family:Plex;font-weight:600;font-size:92px}
.slow{color:#777;text-decoration:line-through;text-decoration-color:#E63946;text-decoration-thickness:8px}
.fast{background:#FFD60A;color:#0d0d0d;padding:4px 26px;border-radius:14px}
.c{width:150px;height:170px;font-size:120px;background:#1d1d1d;color:#fff;border:4px solid #333}
.c.hit{background:#FFD60A;color:#0d0d0d;border-color:#FFD60A}
</style></head><body>
<div class="tag">DSA PATTERNS #3 · LEETCODE 1</div>
<div class="big">Two <span style="color:#FFD60A">Sum</span></div>
<div class="row" style="left:735px;top:180px"><div class="c">3</div><div class="c hit">2</div><div class="c hit">4</div></div>
<div class="hook"><span class="slow">O(n²)</span><span>→</span><span class="fast">O(n)</span></div>
<div class="ix" style="left:735px;top:372px;color:#777"><span>0</span><span>1</span><span>2</span></div>
</body></html>
