# The chalk UI (npm run ui). Run from the repo root so Streamlit finds this file.

[server]
address = "localhost"        # never reachable from the network: the UI starts agents that run commands
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#7a52e0"              # brand violet: the next action, active tabs, focus
backgroundColor = "#1a0f2e"           # the logo's deep plum
secondaryBackgroundColor = "#241640"  # cards, inputs
textColor = "#f3eeff"                 # lilac white
linkColor = "#c9b8ff"
borderColor = "#3a2a5c"
showWidgetBorder = true
codeBackgroundColor = "#140b24"
baseRadius = "0.5rem"
font = "Inter, 'Source Sans Pro', sans-serif"
headingFont = "'Space Grotesk', Inter, sans-serif"
codeFont = "'JetBrains Mono', 'SF Mono', Menlo, monospace"
codeFontSize = "0.8rem"
greenColor = "#7bc47f"
yellowColor = "#e8b44a"
orangeColor = "#ff6a2b"
redColor = "#e5534b"
blueColor = "#6ea8fe"
violetColor = "#b392f0"
grayColor = "#b9abd6"

[theme.sidebar]
backgroundColor = "#1e1236"
secondaryBackgroundColor = "#2a1a4a"
borderColor = "#3a2a5c"
